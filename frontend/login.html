<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Failure Prover — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="dark bg-zinc-950 min-h-screen flex items-center justify-center font-mono">
  <div class="w-full max-w-sm px-4">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-600/10 border border-blue-500/30 mb-4">
        <svg class="w-7 h-7 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"/></svg>
      </div>
      <h1 class="text-xl font-bold text-zinc-100">Failure Prover</h1>
      <p class="text-xs text-zinc-500 mt-1">Autonomous Verification-Driven AI Debugger</p>
    </div>
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 space-y-5 shadow-2xl">
      <div class="text-center">
        <h2 class="text-sm font-semibold text-zinc-200">Sign in to continue</h2>
        <p class="text-xs text-zinc-500 mt-1">Enter your credentials to access the dashboard</p>
      </div>
      <div id="errorAlert" class="hidden p-3 rounded-lg bg-red-950/60 border border-red-800 text-red-300 text-xs text-center">Invalid username or password.</div>
      <div class="space-y-3">
        <div>
          <label class="block text-xs text-zinc-400 mb-1.5">Username</label>
          <input id="username" type="text" placeholder="admin" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2.5 text-sm text-zinc-200 focus:border-blue-500 outline-none transition" onkeydown="if(event.key==='Enter') login()" />
        </div>
        <div>
          <label class="block text-xs text-zinc-400 mb-1.5">Password</label>
          <input id="password" type="password" placeholder="????????" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2.5 text-sm text-zinc-200 focus:border-blue-500 outline-none transition" onkeydown="if(event.key==='Enter') login()" />
        </div>
      </div>
      <button onclick="login()" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 px-6 rounded-xl text-sm transition flex items-center justify-center gap-2">
        <span id="loginText">Sign In</span>
      </button>
      <p class="text-center text-[11px] text-zinc-600">Default: <span class="text-zinc-400 font-mono">admin</span> / <span class="text-zinc-400 font-mono">demo1234</span></p>
    </div>
  </div>
  <script>
    if (localStorage.getItem('fp_token')) { window.location.href = '/'; }
    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errAlert = document.getElementById('errorAlert');
      errAlert.classList.add('hidden');
      document.getElementById('loginText').textContent = 'Signing in...';
      document.getElementById('loginBtn').disabled = true;
      try {
        const res = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
        const data = await res.json();
        if (res.ok && data.token) {
          localStorage.setItem('fp_token', data.token);
          window.location.href = '/';
        } else {
          errAlert.textContent = data.error || 'Invalid credentials.';
          errAlert.classList.remove('hidden');
        }
      } catch(err) {
        errAlert.textContent = 'Network error. Please try again.';
        errAlert.classList.remove('hidden');
      } finally {
        document.getElementById('loginText').textContent = 'Sign In';
        document.getElementById('loginBtn').disabled = false;
      }
    }
  </script>
</body>
</html>
